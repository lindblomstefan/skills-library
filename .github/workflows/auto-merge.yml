name: Auto-merge community PRs

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Guard paths and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          FILES=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          echo "Files in PR:"
          echo "$FILES"

          ALLOWED='^(\.claude/skills/skills-library/feedback/|catalog/library-skills/|\.claude/skills/skills-library/references/catalog-overview\.md)'
          BLOCKED=""

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! echo "$f" | grep -qE "$ALLOWED"; then
              BLOCKED="$f"
              break
            fi
          done <<< "$FILES"

          if [ -n "$BLOCKED" ]; then
            echo "BLOCKED by: $BLOCKED"
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "Auto-merge blocked: ${BLOCKED} is outside the allowed paths. A maintainer will review."
            exit 1
          fi

          echo "All paths allowed. Merging."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash
