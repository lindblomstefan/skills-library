name: Health check

on:
  schedule:
    - cron: '0 5 * * *'  # Every day 06:00 CET (UTC+1) / 07:00 CEST in summer
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run full test suite
        run: npm test
