name: Health check

on:
  schedule:
    - cron: '0 7 * * *'  # Every day 07:00 UTC (09:00 CEST)
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run full test suite
        run: npm test
