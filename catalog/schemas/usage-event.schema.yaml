schema: usage-event
version: 0.1
required:
  - event_id
  - occurred_at
  - skill_id
  - event_type
  - model
  - runtime
  - task_type
  - catalog_version

fields:
  event_id:
    type: string
    description: Unique event id.
  occurred_at:
    type: datetime
    description: When the event happened.
  skill_id:
    type: string
    description: Skill identifier.
  pack_id:
    type: string
    description: Pack identifier, if relevant.
  recommendation_id:
    type: string
    description: Router recommendation id that produced or influenced this event.
  session_id:
    type: string
    description: Pseudonymous session id, if collected.
  catalog_version:
    type: string
    description: Catalog version or commit sha used.
  router_version:
    type: string
    description: Router version used.
  event_type:
    type: enum
    values:
      - recommended
      - installed
      - invoked
      - completed
      - skipped
      - failed
    description: Usage signal type.
  model:
    type: string
    description: Model or agent family.
  runtime:
    type: string
    description: CLI, IDE, dashboard, or agent runtime.
  task_type:
    type: string
    description: Task type associated with the usage.
  source:
    type: string
    description: CLI, dashboard, router, manual, or automation.
  outcome:
    type: string
    description: Optional result summary.
  rank:
    type: integer
    description: Recommendation rank shown to the user or agent.
  selected:
    type: boolean
    description: Whether this recommendation was selected.
  presented_alternatives:
    type: list
    description: Other skill ids shown in the same recommendation set.
  privacy:
    type: object
    description: Sensitivity, redaction status, retention, and no-prompt/no-code/no-secret constraints.
  metadata:
    type: object
    description: Non-sensitive contextual metadata from an allowlist only.
