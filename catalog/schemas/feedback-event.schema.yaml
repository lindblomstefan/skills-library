schema: feedback-event
version: 0.1
required:
  - feedback_id
  - occurred_at
  - skill_id
  - signal
  - model
  - runtime
  - task_type
  - catalog_version

fields:
  feedback_id:
    type: string
    description: Unique feedback id.
  occurred_at:
    type: datetime
    description: When the feedback was captured.
  skill_id:
    type: string
    description: Skill identifier.
  pack_id:
    type: string
    description: Pack identifier, if relevant.
  recommendation_id:
    type: string
    description: Router recommendation id, if feedback relates to a recommendation.
  session_id:
    type: string
    description: Pseudonymous session id, if collected.
  catalog_version:
    type: string
    description: Catalog version or commit sha used.
  router_version:
    type: string
    description: Router version used.
  signal:
    type: enum
    values:
      - worked-well
      - wrong-recommendation
      - skill-stale
      - skill-missing
      - model-runtime-mismatch
      - bad-output
      - security-concern
      - privacy-concern
      - license-concern
      - better-replacement-exists
    description: Feedback signal.
  model:
    type: string
    description: Model or agent family.
  runtime:
    type: string
    description: CLI, IDE, website, or agent runtime.
  task_type:
    type: string
    description: Task type associated with the feedback.
  severity:
    type: enum
    values:
      - low
      - medium
      - high
      - blocking
      - unknown
    description: Impact of the feedback.
  notes:
    type: string
    description: Optional redacted notes. Do not store prompts, source code, secrets, personal data, or customer data.
  privacy:
    type: object
    description: Sensitivity, redaction status, retention, and actor/team pseudonymization.
  created_issue:
    type: string
    description: Link to generated issue, if one was created.
