    reason: Provides the repo graph used before raw browsing.
  - id: initiative-skill-recommender
    reason: Interviews initiative intent and maps it to a skill set.
  - id: skill-library-onboarding
    reason: Handles the first POC step of onboarding a known skill candidate.
excludes: []
review:
  owner: unassigned
  cadence: monthly
  next_review: 2026-09-13
