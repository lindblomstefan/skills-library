known_limitations:
  - Procedural output — accuracy depends on how well the 3D structure can be inferred from a 2D image.
  - Not a photogrammetry or mesh-capture tool; output is code-first geometry, not a scan.
  - Complex organic shapes may need manual refinement after generation.