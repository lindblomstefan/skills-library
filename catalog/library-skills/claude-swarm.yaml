    - status:candidate
    - runtime:claude-code
distribution:
  install:
    type: claude-skill
    command: claude skills install https://github.com/affaan-m/claude-swarm
  invoke:
    command: /claude-swarm or describe the multi-agent task
  dependencies: []
  required_permissions: []
  required_secrets: []
  network_access: none
routing:
