id: claude-swarm
name: Claude Swarm
catalog_visibility: library
source_type: external
status: candidate
stability: stable
proposed_by: skills-library-onboarding
proposed_at: 2026-09-06
summary: Multi-agent orchestration for Claude Code — decomposes tasks, coordinates parallel agents, and visualizes the swarm in a rich terminal UI.
source:
  type: external-skill
  url: https://github.com/affaan-m/claude-swarm
  license: clear
  license_spdx: MIT
  redistribution: permitted
  modification_allowed: permitted
  maintainer: external
  version_or_commit: latest
  documentation: https://github.com/affaan-m/claude-swarm#readme
  dependencies: []
  copied_assets: []
domains:
  - coding
  - architecture
task_types:
  - architecture-review
  - codebase-navigation
use_when:
  - Running complex tasks that benefit from parallel Claude Code agents.
  - Decomposing a large feature or refactor across independent workstreams.
  - Wanting a live visual overview of multi-agent progress in the terminal.
do_not_use_when:
  - Tasks that require shared mutable state across agents.
  - Single-agent tasks with no parallelism benefit.
compatibility:
  matrix:
    - model_id: claude
      runtime_id: claude-code
      support: compatible
      tested_at: 2026-09-06
