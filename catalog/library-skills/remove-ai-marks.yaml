  recommendation_signal_available: true
  known_metrics_gaps: []
known_limitations:
  - Requires a running Docker service — not a zero-setup skill.
  - PDF strip is best-effort without exiftool and qpdf server-side.
  - Pixel-domain image watermark removal needs optional heavy backends.
  - Layer B (statistical rewrite) cannot be verified without vendor detectors.
  - C2PA soft binding is out of scope.
  - Audio/video watermarks are out of scope.
