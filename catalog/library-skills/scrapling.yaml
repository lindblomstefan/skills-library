known_limitations:
  - Requires Python 3.10+ and pip.
  - Always use --ai-targeted flag on CLI commands to guard against prompt injection from scraped content.
  - Scraping may violate TOS of some sites — user is responsible for legal compliance.
  - Proxy and CDP mode require user-supplied credentials.
