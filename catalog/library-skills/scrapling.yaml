distribution:
  install:
    type: external-skill
    command: Copy the Scrapling-Skill folder from d4vinci/Scrapling/agent-skill/ into ~/.claude/skills/. Install scrapling with pip install scrapling.
  invoke:
    command: Reference scrapling-official in a Claude session.
  generated_files: []
  dependencies:
    - python3
    - pip
    - scrapling
  required_permissions:
    - read-repository
    - write-files
    - bash
  required_secrets: []
  network_access: internet
routing:
  recommend_for:
    - scrape a website
    - bypass Cloudflare or anti-bot protection
    - crawl pages with JavaScript rendering
    - build a web spider
    - extract data from a website
    - web_fetch returns blocked or incomplete content
  caution_for:
    - sites where scraping violates terms of service
    - users without Python 3.10+ available
  not_recommended_for:
    - simple API calls or pages with no anti-bot protection
    - non-Python environments
  example_prompts:
    - Scrape product prices from this e-commerce site.
    - Build a spider to crawl and index all pages on this domain.
    - Extract the main article content from these URLs — web_fetch keeps getting blocked.
    - Write a stealthy scraper that handles Cloudflare Turnstile.
  anti_examples:
    - Fetch the contents of this public JSON API.
    - Review this pull request for bugs.
  keywords:
