id: scrapling
name: Scrapling
catalog_visibility: library
source_type: external
status: evaluating
stability: stable
proposed_by: skills-library
proposed_at: 2026-08-16
summary: Official skill for the Scrapling adaptive web scraping framework — handles everything from single requests to full-scale crawls. Bypasses anti-bot systems (Cloudflare Turnstile), stealth headless browsing, adaptive element relocation when pages change, spider framework with pause/resume and proxy rotation. Requires Python 3.10+.
source:
  type: external-skill
  url: https://github.com/d4vinci/Scrapling
  license: BSD 3-Clause License
  license_spdx: BSD-3-Clause
  redistribution: allowed
  modification_allowed: allowed
  maintainer: d4vinci
  version_or_commit: "0.4.14"
  documentation: https://scrapling.readthedocs.io/en/latest/index.html
  dependencies:
    - python3
    - pip
  copied_assets: []
domains:
  - coding
  - repository-analysis
task_types:
  - project-onboarding
  - codebase-navigation
use_when:
  - Scraping or crawling websites, especially those with anti-bot protections.
  - web_fetch fails due to Cloudflare or other anti-bot systems.
  - Writing Python code to scrape or crawl web pages.
  - Building spiders for concurrent multi-session crawls.
  - Extracting structured data from dynamically rendered pages.
  - Adapting scrapers that break when page structure changes.
do_not_use_when:
  - Simple HTTP fetches where web_fetch works fine.
  - Non-Python environments where pip/Python 3.10+ is unavailable.
  - Legal or TOS concerns about scraping the target site.
compatibility:
  matrix:
