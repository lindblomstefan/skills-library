id: apple-design
name: Apple Design
catalog_visibility: library
source_type: external
status: evaluating
stability: stable
proposed_by: skills-library
proposed_at: 2026-08-15
summary: Apple's approach to interface design and fluid, physical motion translated for the web — springs, gesture physics, interruptibility, translucent materials, typography, and the eight design principles from WWDC talks.
source:
  type: external-skill
  url: https://github.com/emilkowalski/skills/tree/main/skills/apple-design
  license: MIT License
  license_spdx: MIT
  redistribution: allowed
  modification_allowed: allowed
  maintainer: emilkowalski/skills
  version_or_commit: main
  documentation: https://github.com/emilkowalski/skills/blob/main/skills/apple-design/SKILL.md
  dependencies: []
  copied_assets: []
domains:
  - ui-ux
  - coding
task_types:
  - pull-request-review
  - project-onboarding
use_when:
  - Building gesture-driven UI with drag, swipe, or sheet interactions.
  - Implementing spring animations that need to feel physically natural and interruptible.
  - Reviewing frontend UI for motion quality, responsiveness, or design coherence.
  - The project aims for Apple-quality feel in a web or React context.
do_not_use_when:
  - Backend-only work with no UI component.
  - The design system forbids custom animations or uses a rigid component library.
  - Accessibility requirements prohibit motion (use reduced-motion guidance from the skill instead).
