  invoke:
    command: Reference the skill by name in a Claude session; or trigger via slash command if configured.
  generated_files: []
  dependencies:
    - motion
    - framer-motion
  required_permissions:
    - read-repository
    - write-files
  required_secrets: []
  network_access: none
routing:
  recommend_for:
    - build a gesture-driven UI
    - implement spring animations
    - review UI for motion quality
    - design a bottom sheet or drawer
    - make an interface feel fluid and physical
  caution_for:
    - teams with strict design system tokens that conflict with custom spring values
    - projects where prefers-reduced-motion must be the default
  not_recommended_for:
    - backend-only tasks
    - CLI tools with no UI
    - projects using non-web runtimes
  example_prompts:
    - Review this drag gesture implementation for fluid interruptibility.
    - Help me implement a spring animation that hands off velocity from the drag release.
    - Does this sheet interaction follow Apple's motion principles?
  anti_examples:
    - Write a database migration.
    - Refactor this API handler.
  keywords:
