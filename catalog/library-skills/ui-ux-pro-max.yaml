id: ui-ux-pro-max
name: UI UX Pro Max
catalog_visibility: library
source_type: external
status: candidate
stability: stable
proposed_by: skills-library-onboarding
proposed_at: 2026-09-06
summary: Design intelligence skill with 192 reasoning rules and 79 searchable UI styles. Generates complete design systems (palette, typography, layout patterns, component guidance) from a plain-English brief. Works across React, Tailwind, mobile UI, and more.
source:
  type: external-skill
  url: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
  license: clear
  license_spdx: MIT
  redistribution: permitted
  modification_allowed: permitted
  maintainer: external
  version_or_commit: latest
  documentation: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill#readme
  dependencies: []
  copied_assets: []
domains:
  - ui-design
  - design-systems
  - frontend-development
task_types:
  - design-system-generation
  - ui-style-selection
  - component-design
  - landing-page-design
  - mobile-ui-design
use_when:
  - Starting a new UI and needing a coherent design system quickly.
  - Choosing a visual style for a product (SaaS, landing page, mobile app).
  - Generating palette, typography, and layout from a one-sentence brief.
  - Reducing back-and-forth on aesthetic decisions with a shared style vocabulary.
do_not_use_when:
  - The project already has a locked design system to follow.
  - The task is backend-only with no UI component.
